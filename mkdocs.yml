site_name: apidanikan.github.io
site_url: https://apidanikan.github.io
nav:
  - Beranda: index.md
  - Add-on Minecraft Saya: add-on/index.md
extra_css:
  - css/style.css
theme:
  name: material
  logo: css/user.png
  favicon: css/user.png
  features:
    - navigation.instant
    - navigation.indexes
    - search.suggest
  palette: 
    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Ganti ke mode terang

    # Palette toggle for light mode
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7 
        name: Ganti ke mode gelap
plugins:
  - search

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.betterem